name: gestor_ufu
description: "Ferramentas acadêmicas UFU, incluindo gestão de disciplinas Moodle."
publish_to: 'none'
version: 1.1.23+24

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  http: ^1.4.0
  shared_preferences: ^2.5.3
  file_picker: ^8.3.7
  excel: ^4.0.6
  intl: ^0.20.2
  path: ^1.9.1
  uuid: ^4.5.1
  collection: ^1.19.1
  puppeteer: ^3.16.0
  archive: ^3.6.1
  xml: ^6.5.0
  html: ^0.15.7
  pdf: 3.11.3
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.4
  package_info_plus: ^9.0.1
  desktop_multi_window: 0.3.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true
  image_path: "assets/icone.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icone.png"

flutter:
  uses-material-design: true
  assets:
    - assets/adjust_schedule/seed.json
