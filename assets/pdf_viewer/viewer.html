<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Documento do processo</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9eaee; font-family: "Segoe UI", sans-serif; }
  #area { position: absolute; inset: 0; overflow: auto; }
  #paginas { padding: 16px 12px 60px; display: flex; flex-direction: column; align-items: safe center; gap: 14px; width: max-content; min-width: calc(100% - 24px); }
  .pagina { position: relative; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .pagina canvas { position: absolute; inset: 0; display: block; }
  .pagina .marcas { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .pagina .marca { position: absolute; mix-blend-mode: multiply; border-radius: 2px; }
  .pagina .marca.ativa { outline: 2px solid #1f6fd1; outline-offset: 1px; }
  .pagina .marca.comentada { box-shadow: inset 0 -2px 0 rgba(0,0,0,.45); }
  .pagina .marca.busca { background: rgba(255, 140, 0, .45); outline: 2px solid #e67700; }
  .pagina .rotulo { position: absolute; right: 6px; bottom: -16px; font-size: 11px; color: #6b7080; }
  .pagina .carregando { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9aa0ad; font-size: 13px; }

  /* Camada de texto do pdf.js (pdf_viewer.css, Apache 2.0). */
  .textLayer { position: absolute; text-align: initial; inset: 0; overflow: clip; opacity: 1; line-height: 1;
    text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; caret-color: CanvasText; z-index: 2; }
  .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
  .textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) { z-index: 1; }
  .textLayer span.markedContent { top: 0; height: 0; }
  .textLayer ::selection { background: rgba(0, 90, 255, .28); }
  .textLayer br::selection { background: transparent; }
  .textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: 0; cursor: default; user-select: none; }
  .textLayer.selecting .endOfContent { top: 0; }

  #menu { position: fixed; z-index: 100; min-width: 220px; background: #fff; border: 1px solid #c9ccd4; border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18); padding: 4px 0; font-size: 13px; }
  #menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 14px; font: inherit; color: #1d2230; cursor: pointer; }
  #menu button:hover:not(:disabled) { background: #eef3fb; }
  #menu button:disabled { color: #a3a8b4; cursor: default; }
  #menu .dica { border-top: 1px solid #e3e5ea; margin-top: 4px; padding: 5px 14px 2px; font-size: 11px; color: #7a8090; }
  #erro { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 30px; text-align: center; color: #8a1f1f; }
</style>
</head>
<body>
<div id="area"><div id="paginas"></div></div>
<div id="erro"></div>
<script type="module" src="viewer.js"></script>
</body>
</html>
