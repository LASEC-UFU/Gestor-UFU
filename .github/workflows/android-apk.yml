name: Build Android APK
run-name: Gestor UFU Android APK (${{ github.ref_name }})

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Fetch Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build installable debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestor-ufu-android-debug-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Show APK download location
        if: success()
        shell: bash
        run: |
          echo "## APK pronto para baixar" >> "$GITHUB_STEP_SUMMARY"
          echo "Baixe o artefato **gestor-ufu-android-debug-${GITHUB_SHA}** na seção **Artifacts** desta execução." >> "$GITHUB_STEP_SUMMARY"
          echo "[Abrir esta execução no GitHub](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"
