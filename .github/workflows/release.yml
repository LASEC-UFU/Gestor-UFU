name: Flutter Build & Release (Gestor UFU)

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      version:
        description: "Versão/Tag (ex.: v1.2.3 ou V1.2.3-RC5)"
        required: true
        type: string
      notes:
        description: "Notas da release (opcional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  # ─── 1. Normalizar versão ──────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.ver.outputs.base_version }}
      wix_version:  ${{ steps.ver.outputs.wix_version }}
      msi_name:     ${{ steps.ver.outputs.msi_name }}
    steps:
      - name: Normalizar versão
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ inputs.version || github.ref_name }}"
          RAW="${RAW//[[:space:]]/}"
          CLEAN="${RAW#[vV]}"
          # Remove sufixo (ex.: -RC5) do número de versão
          BASE=$(echo "$CLEAN" | sed 's/-[A-Za-z].*//')
          # WiX exige formato X.Y.Z.W
          PARTS=$(echo "$BASE" | awk -F. '{print NF}')
          if [ "$PARTS" -eq 3 ]; then
            WIX="${BASE}.0"
          else
            WIX="$BASE"
          fi
          echo "base_version=$BASE"                             >> "$GITHUB_OUTPUT"
          echo "wix_version=$WIX"                              >> "$GITHUB_OUTPUT"
          echo "msi_name=GestorUFU-${BASE}-windows.msi"     >> "$GITHUB_OUTPUT"

  # ─── 2. Compilar e empacotar Windows MSI ──────────────────────────────
  build-windows-msi:
    runs-on: windows-latest
    needs: prepare
    env:
      MSI_NAME: ${{ needs.prepare.outputs.msi_name }}
      WIX_VER:  ${{ needs.prepare.outputs.wix_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Dependências Flutter
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --build-name "${{ needs.prepare.outputs.base_version }}"

      - name: Adicionar WiX Toolset ao PATH
        shell: powershell
        run: |
          $wixDir = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory `
                    | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixDir) {
            Write-Output "WiX não encontrado, instalando via Chocolatey..."
            choco install wixtoolset -y --no-progress
            $wixDir = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory `
                      | Sort-Object Name -Descending | Select-Object -First 1
          }
          $wixBin = "$($wixDir.FullName)\bin"
          Write-Output "WiX encontrado em: $wixBin"
          "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Colher arquivos do build (heat.exe)
        shell: powershell
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          heat.exe dir $buildDir `
            -nologo -srd -scom -sreg `
            -cg HarvestedFiles `
            -dr INSTALLFOLDER `
            -var var.BuildDir `
            -ag `
            -out "windows\installer\harvested.wxs"

          # Keep a new, stable identity for the main executable component.
          # Older MSIs could consider a stale EXE newer than the package,
          # skip installing the replacement and then remove the old file.
          [xml]$harvest = Get-Content "windows\installer\harvested.wxs"
          $ns = New-Object System.Xml.XmlNamespaceManager($harvest.NameTable)
          $ns.AddNamespace("w", "http://schemas.microsoft.com/wix/2006/wi")
          $exeComponent = $harvest.SelectSingleNode(
            "//w:Component[w:File[contains(@Source, 'config_moodle.exe')]]",
            $ns
          )
          if (-not $exeComponent) { throw "Main executable component not found in harvested.wxs" }
          $exeComponent.SetAttribute("Guid", "{A178A3F0-48BD-4D07-AF79-1FE3EF49C572}")
          $harvest.Save((Resolve-Path "windows\installer\harvested.wxs").Path)

      - name: Compilar WiX (candle.exe)
        shell: powershell
        run: |
          $buildDir = (Resolve-Path "build\windows\x64\runner\Release").Path
          $appExe   = "$buildDir\config_moodle.exe"
          New-Item -ItemType Directory -Force -Path "windows\installer\obj" | Out-Null
          candle.exe -nologo -arch x64 `
            "-dProductVersion=$env:WIX_VER" `
            "-dBuildDir=$buildDir" `
            "-dAppExe=$appExe" `
            "windows\installer\product.wxs" `
            "windows\installer\harvested.wxs" `
            -out "windows\installer\obj\"

      - name: Vincular MSI (light.exe)
        shell: powershell
        run: |
          light.exe -nologo `
            -ext WixUIExtension `
            -ext WixUtilExtension `
            "windows\installer\obj\product.wixobj" `
            "windows\installer\obj\harvested.wixobj" `
            -out "$env:MSI_NAME"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: ${{ env.MSI_NAME }}
          if-no-files-found: error

  # ─── 3. Criar GitHub Release ─────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: [prepare, build-windows-msi]
    steps:
      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-msi

      - name: Criar Release e anexar artefatos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: "Gestor UFU ${{ inputs.version || github.ref_name }}"
          body: ${{ inputs.notes }}
          generate_release_notes: ${{ inputs.notes == '' }}
          prerelease: false
          target_commitish: ${{ github.sha }}
          files: |
            ${{ needs.prepare.outputs.msi_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
