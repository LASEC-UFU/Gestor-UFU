name: Flutter Build & Release (Gestor UFU)

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      version:
        description: "Versão/Tag (ex.: v1.2.3 ou V1.2.3-RC5)"
        required: true
        type: string
      notes:
        description: "Notas da release (opcional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  # ─── 1. Normalizar versão ──────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.ver.outputs.base_version }}
      wix_version:  ${{ steps.ver.outputs.wix_version }}
      msi_name:     ${{ steps.ver.outputs.msi_name }}
      apk_name:     ${{ steps.ver.outputs.apk_name }}
    steps:
      - name: Normalizar versão
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ inputs.version || github.ref_name }}"
          RAW="${RAW//[[:space:]]/}"
          CLEAN="${RAW#[vV]}"
          # Remove sufixo (ex.: -RC5) do número de versão
          BASE=$(echo "$CLEAN" | sed 's/-[A-Za-z].*//')
          # WiX exige formato X.Y.Z.W
          PARTS=$(echo "$BASE" | awk -F. '{print NF}')
          if [ "$PARTS" -eq 3 ]; then
            WIX="${BASE}.0"
          else
            WIX="$BASE"
          fi
          echo "base_version=$BASE"                             >> "$GITHUB_OUTPUT"
          echo "wix_version=$WIX"                              >> "$GITHUB_OUTPUT"
          echo "msi_name=GestorUFU-${BASE}-windows.msi"     >> "$GITHUB_OUTPUT"
          echo "apk_name=GestorUFU-${BASE}-android.apk"       >> "$GITHUB_OUTPUT"

  # ─── 2. Compilar e empacotar Windows MSI ──────────────────────────────
  build-windows-msi:
    runs-on: windows-latest
    needs: prepare
    env:
      MSI_NAME: ${{ needs.prepare.outputs.msi_name }}
      WIX_VER:  ${{ needs.prepare.outputs.wix_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Versão fixa: o motor de versões mais novas do stable trava
      # (0xc0000005 em flutter_windows.dll) ao abrir janelas secundárias.
      - name: Configurar Flutter (3.41.9)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.41.9"
          cache: true

      - name: Dependências Flutter
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --build-name "${{ needs.prepare.outputs.base_version }}"

      # Poppler (pdftotext/pdftoppm) dentro da pasta do app: leitura de PDFs
      # e PDF anotado do Audita Bancas sem depender de instalação externa.
      # Versão fixa e conferida pelo SHA-256; só os arquivos necessários
      # (windows/installer/poppler_files.txt) vão para o instalador.
      - name: Incluir Poppler no pacote
        shell: powershell
        env:
          POPPLER_URL: https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip
          POPPLER_SHA256: 7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'poppler.zip'
          Invoke-WebRequest -Uri $env:POPPLER_URL -OutFile $zip -UseBasicParsing
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:POPPLER_SHA256) { throw "SHA-256 do Poppler não confere: $hash" }
          $tmp = Join-Path $env:RUNNER_TEMP 'poppler'
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $raiz = Get-ChildItem $tmp -Directory | Select-Object -First 1
          $origem = Join-Path $raiz.FullName 'Library\bin'
          $destino = 'build\windows\x64\runner\Release\poppler'
          New-Item -ItemType Directory -Force -Path "$destino\bin" | Out-Null
          $arquivos = Get-Content 'windows\installer\poppler_files.txt' |
            Where-Object { $_.Trim() -and -not $_.StartsWith('#') }
          foreach ($f in $arquivos) {
            Copy-Item -Path (Join-Path $origem $f.Trim()) -Destination "$destino\bin" -ErrorAction Stop
          }
          Copy-Item -Path (Join-Path $raiz.FullName 'share\poppler\COPYING*') -Destination $destino
          Copy-Item -Path 'windows\installer\POPPLER_LEIA-ME.txt' -Destination "$destino\LEIA-ME.txt"
          # Confere que roda só com os arquivos copiados.
          $versao = cmd /c "`"$destino\bin\pdftotext.exe`" -v 2>&1"
          if ($LASTEXITCODE -ne 0) { throw "pdftotext empacotado não executou: $versao" }
          Write-Output $versao
          cmd /c "`"$destino\bin\pdftoppm.exe`" -v 2>&1" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'pdftoppm empacotado não executou' }

      - name: Adicionar WiX Toolset ao PATH
        shell: powershell
        run: |
          $wixDir = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory `
                    | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixDir) {
            Write-Output "WiX não encontrado, instalando via Chocolatey..."
            choco install wixtoolset -y --no-progress
            $wixDir = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory `
                      | Sort-Object Name -Descending | Select-Object -First 1
          }
          $wixBin = "$($wixDir.FullName)\bin"
          Write-Output "WiX encontrado em: $wixBin"
          "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Colher arquivos do build (heat.exe)
        shell: powershell
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          # Older app versions relaunch config_moodle.exe after the MSI upgrade.
          # Ship a compatibility copy so their updater can complete the first
          # transition to GestorUFU.exe. New shortcuts point to GestorUFU.exe.
          Copy-Item "$buildDir\GestorUFU.exe" "$buildDir\config_moodle.exe"
          heat.exe dir $buildDir `
            -nologo -srd -scom -sreg `
            -cg HarvestedFiles `
            -dr INSTALLFOLDER `
            -var var.BuildDir `
            -ag `
            -out "windows\installer\harvested.wxs"

          # Give the renamed GestorUFU.exe its own stable component identity.
          # The prior MSI owns config_moodle.exe under a different component;
          # MajorUpgrade removes it while this component installs the new file.
          [xml]$harvest = Get-Content "windows\installer\harvested.wxs"
          $ns = New-Object System.Xml.XmlNamespaceManager($harvest.NameTable)
          $ns.AddNamespace("w", "http://schemas.microsoft.com/wix/2006/wi")
          $exeComponent = $harvest.SelectSingleNode(
            "//w:Component[w:File[contains(@Source, 'GestorUFU.exe')]]",
            $ns
          )
          if (-not $exeComponent) { throw "Main executable component not found in harvested.wxs" }
          $exeComponent.SetAttribute("Guid", "{B289B4F1-59CE-4E18-BF80-2AF4EF13D683}")
          $compatComponent = $harvest.SelectSingleNode(
            "//w:Component[w:File[contains(@Source, 'config_moodle.exe')]]",
            $ns
          )
          if (-not $compatComponent) { throw "Compatibility executable component not found in harvested.wxs" }
          # This is the component identity used by prior MSIs for config_moodle.exe.
          $compatComponent.SetAttribute("Guid", "{A178A3F0-48BD-4D07-AF79-1FE3EF49C572}")
          $harvest.Save((Resolve-Path "windows\installer\harvested.wxs").Path)

      - name: Compilar WiX (candle.exe)
        shell: powershell
        run: |
          $buildDir = (Resolve-Path "build\windows\x64\runner\Release").Path
          $appExe   = "$buildDir\GestorUFU.exe"
          New-Item -ItemType Directory -Force -Path "windows\installer\obj" | Out-Null
          candle.exe -nologo -arch x64 `
            "-dProductVersion=$env:WIX_VER" `
            "-dBuildDir=$buildDir" `
            "-dAppExe=$appExe" `
            "windows\installer\product.wxs" `
            "windows\installer\harvested.wxs" `
            -out "windows\installer\obj\"

      - name: Vincular MSI (light.exe)
        shell: powershell
        run: |
          light.exe -nologo `
            -ext WixUIExtension `
            -ext WixUtilExtension `
            "windows\installer\obj\product.wixobj" `
            "windows\installer\obj\harvested.wixobj" `
            -out "$env:MSI_NAME"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: ${{ env.MSI_NAME }}
          if-no-files-found: error

  # ─── 3. Criar GitHub Release ─────────────────────────────────────────
  build-android-apk:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Fetch Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build installable Android APK
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Name APK by release version
        shell: bash
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk "${{ needs.prepare.outputs.apk_name }}"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ needs.prepare.outputs.apk_name }}
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs: [prepare, build-windows-msi, build-android-apk]
    steps:
      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-msi

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Criar Release e anexar artefatos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: "Gestor UFU ${{ inputs.version || github.ref_name }}"
          body: ${{ inputs.notes }}
          generate_release_notes: ${{ inputs.notes == '' }}
          prerelease: false
          target_commitish: ${{ github.sha }}
          files: |
            ${{ needs.prepare.outputs.msi_name }}
            ${{ needs.prepare.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
